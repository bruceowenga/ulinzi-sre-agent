[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ulinzi"
version = "0.1.0"
description = "Multi-agent SRE incident responder"
requires-python = ">=3.12"

dependencies = [
    "langgraph>=0.2,<0.4",
    "langgraph-checkpoint-sqlite>=1.0",
    "ollama>=0.3",
    "instructor>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langfuse>=2.0",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["agents", "runbooks"]
